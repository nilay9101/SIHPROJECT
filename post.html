<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Detail - MindWell</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2b2e83;
            --primary-2: #3843a8;
            --secondary: #6c8ef5;
            --accent: #ffb86b;
            --accent-2: #ff6b6b;
            --muted: #6c7a89;
            --bg: #f4f7ff;
            --card-bg: rgba(255,255,255,0.88);
            --glass-border: rgba(108,142,245,0.10);
            --dark: #233047;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg,var(--bg),#ffffff);
            color: var(--dark);
            line-height: 1.6;
        }

        .navbar {
            background: linear-gradient(90deg,var(--primary-2),var(--primary));
            box-shadow: 0 8px 32px rgba(34,40,80,0.12);
        }

        .navbar-brand {
            color: #fff !important;
            font-weight: 700;
        }

        .post-header {
            background: linear-gradient(135deg,var(--primary),var(--secondary));
            color: #fff;
            padding: 30px 0;
            margin-bottom: 30px;
        }

        .forum-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(6px);
            box-shadow: 0 10px 30px rgba(34,40,80,0.06);
            border-radius: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .forum-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(34,40,80,0.10);
        }

        .category-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .post-content {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .post-actions {
            display: flex;
            gap: 15px;
            padding: 20px 0;
            border-top: 1px solid rgba(108,142,245,0.08);
            border-bottom: 1px solid rgba(108,142,245,0.08);
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: 1px solid rgba(108,142,245,0.20);
            background: transparent;
            border-radius: 8px;
            color: var(--muted);
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .action-btn:hover {
            background: rgba(108,142,245,0.08);
            color: var(--primary);
            border-color: var(--secondary);
        }

        .action-btn.liked {
            background: rgba(255,107,107,0.1);
            border-color: var(--accent-2);
            color: var(--accent-2);
        }

        .comment-section {
            margin-top: 30px;
        }

        .comment-form {
            background: rgba(108,142,245,0.02);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .comment-item {
            padding: 20px;
            border-bottom: 1px solid rgba(108,142,245,0.08);
            transition: background-color 0.2s ease;
        }

        .comment-item:hover {
            background-color: rgba(108,142,245,0.02);
        }

        .comment-item:last-child {
            border-bottom: none;
        }

        .comment-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 10px;
        }

        .comment-author {
            font-weight: 600;
            color: var(--primary);
        }

        .comment-date {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .comment-content {
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .comment-actions {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
        }

        .btn-primary {
            background: linear-gradient(90deg,var(--secondary),var(--primary));
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(43,46,131,0.15);
        }

        .btn-secondary {
            background: rgba(108,142,245,0.1);
            border: 1px solid rgba(108,142,245,0.20);
            color: var(--primary);
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: rgba(108,142,245,0.15);
            color: var(--primary);
        }

        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid rgba(108,142,245,0.20);
            padding: 10px 15px;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 0.2rem rgba(108,142,245,0.25);
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .edit-form {
            display: none;
            background: rgba(108,142,245,0.02);
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .edit-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .modal-content {
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: var(--card-bg);
            backdrop-filter: blur(10px);
        }

        @media (max-width: 768px) {
            .post-actions {
                flex-direction: column;
                gap: 10px;
            }
            
            .post-header .row {
                flex-direction: column;
                text-align: center;
            }
            
            .post-header .col-lg-4 {
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-brain me-2"></i> MindWell
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#resources">Resources</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="forum.html">Community Forum</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#booking">Book Appointment</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#assessment">Self-Assessment</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item" id="userInfo" style="display: none;">
                        <span class="navbar-text me-3">
                            <i class="fas fa-user me-1"></i>
                            <span id="userName"></span>
                        </span>
                    </li>
                    <li class="nav-item" id="logoutBtn" style="display: none;">
                        <button class="btn btn-outline-light btn-sm" onclick="logout()">
                            <i class="fas fa-sign-out-alt me-1"></i> Logout
                        </button>
                    </li>
                    <li class="nav-item" id="loginBtn">
                        <a class="btn btn-outline-light btn-sm" href="login.html">
                            <i class="fas fa-sign-in-alt me-1"></i> Login
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Post Header -->
    <div class="post-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-8">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="forum.html" class="text-light">Community Forum</a></li>
                            <li class="breadcrumb-item active text-light" aria-current="page">Post Detail</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-4 text-lg-end">
                    <button class="btn btn-light" onclick="window.location.href='forum.html'">
                        <i class="fas fa-arrow-left me-2"></i>Back to Forum
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <!-- Loading State -->
        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3">Loading post...</p>
        </div>

        <!-- Post Content -->
        <div id="postContent" style="display: none;">
            <div class="forum-card mb-4">
                <div class="card-body p-4">
                    <!-- Post Header -->
                    <div class="category-badge" id="postCategoryBadge"></div>
                    <h1 class="display-6 fw-bold mb-3" id="postTitle"></h1>
                    <div class="post-meta mb-4">
                        <span class="me-3">
                            <i class="fas fa-user me-1"></i>
                            <span id="postAuthor"></span>
                        </span>
                        <span class="me-3">
                            <i class="fas fa-clock me-1"></i>
                            <span id="postDate"></span>
                        </span>
                        <span>
                            <i class="fas fa-eye me-1"></i>
                            <span id="postViews"></span> views
                        </span>
                    </div>

                    <!-- Post Content -->
                    <div class="post-content" id="postContentText"></div>

                    <!-- Post Actions -->
                    <div class="post-actions">
                        <button class="action-btn" id="likeBtn" onclick="toggleLike()">
                            <i class="fas fa-heart"></i>
                            <span id="likeCount">0</span> likes
                        </button>
                        <button class="action-btn" onclick="scrollToComments()">
                            <i class="fas fa-comment"></i>
                            <span id="commentCount">0</span> comments
                        </button>
                        <button class="action-btn" onclick="sharePost()">
                            <i class="fas fa-share"></i>
                            Share
                        </button>
                        <button class="action-btn" id="editBtn" onclick="toggleEditMode()" style="display: none;">
                            <i class="fas fa-edit"></i>
                            Edit
                        </button>
                        <button class="action-btn" id="deleteBtn" onclick="deletePost()" style="display: none;">
                            <i class="fas fa-trash"></i>
                            Delete
                        </button>
                    </div>
                </div>
            </div>

            <!-- Comments Section -->
            <div class="forum-card">
                <div class="card-body p-4">
                    <h4 class="mb-4">
                        <i class="fas fa-comments me-2"></i>
                        Comments (<span id="commentsCount">0</span>)
                    </h4>

                    <!-- Comment Form -->
                    <div class="comment-form mb-4" id="commentForm">
                        <div class="mb-3">
                            <textarea class="form-control" id="commentContent" rows="3" placeholder="Share your thoughts..."></textarea>
                        </div>
                        <button class="btn btn-primary" onclick="createComment()">
                            <i class="fas fa-paper-plane me-2"></i>Post Comment
                        </button>
                    </div>

                    <!-- Comments List -->
                    <div id="commentsContainer">
                        <!-- Comments will be loaded here -->
                    </div>

                    <div class="empty-state" id="emptyComments" style="display: none;">
                        <i class="fas fa-comment-slash"></i>
                        <h5>No comments yet</h5>
                        <p>Be the first to share your thoughts!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Global variables
        let currentPost = null;
        let currentUserId = null;
        let isLiked = false;
        let categories = [];

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            loadCategories();
            loadPost();
        });

        // Check authentication
        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const userName = localStorage.getItem('user_name');
            const userId = localStorage.getItem('user_id');
            
            if (token && userName) {
                document.getElementById('userInfo').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'block';
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('userName').textContent = userName;
                currentUserId = userId ? parseInt(userId) : null;
            } else {
                // Hide comment form for non-authenticated users
                document.getElementById('commentForm').style.display = 'none';
            }
        }

        // Logout function
        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user_name');
            localStorage.removeItem('user_id');
            window.location.href = 'login.html';
        }

        // Load categories
        async function loadCategories() {
            try {
                const response = await fetch('/api/forum/categories');
                if (response.ok) {
                    categories = await response.json();
                }
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }

        // Get post ID from URL
        function getPostId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        // Load post
        async function loadPost() {
            const postId = getPostId();
            if (!postId) {
                alert('No post ID provided');
                window.location.href = 'forum.html';
                return;
            }

            const token = localStorage.getItem('access_token');
            if (!token) {
                // Show login prompt for non-authenticated users
                showLoginPrompt();
                return;
            }

            showLoading(true);
            
            try {
                const response = await fetch(`/api/forum/posts/${postId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    currentPost = await response.json();
                    displayPost();
                    loadComments();
                } else if (response.status === 404) {
                    alert('Post not found');
                    window.location.href = 'forum.html';
                } else if (response.status === 401) {
                    // Token expired or invalid
                    logout();
                } else {
                    console.error('Error loading post:', response.status);
                    showError('Failed to load post');
                }
            } catch (error) {
                console.error('Error loading post:', error);
                showError('Failed to load post');
            } finally {
                showLoading(false);
            }
        }

        // Display post
        function displayPost() {
            if (!currentPost) return;

            // Set post content
            document.getElementById('postTitle').textContent = currentPost.title;
            document.getElementById('postContentText').textContent = currentPost.content;
            document.getElementById('postAuthor').textContent = `User #${currentPost.user_id}`;
            document.getElementById('postDate').textContent = formatDate(currentPost.created_at);
            document.getElementById('postViews').textContent = currentPost.view_count;
            document.getElementById('likeCount').textContent = currentPost.like_count;
            document.getElementById('commentCount').textContent = currentPost.comment_count;
            document.getElementById('commentsCount').textContent = currentPost.comment_count;

            // Set category badge
            const category = categories.find(c => c.id === currentPost.category_id);
            if (category) {
                const badge = document.getElementById('postCategoryBadge');
                badge.textContent = category.name;
                badge.style.backgroundColor = `${category.color}20`;
                badge.style.color = category.color;
            }

            // Show edit/delete buttons if current user is the author
            if (currentUserId && currentUserId === currentPost.user_id) {
                document.getElementById('editBtn').style.display = 'inline-flex';
                document.getElementById('deleteBtn').style.display = 'inline-flex';
            }

            // Update like button state
            isLiked = currentPost.is_liked || false;
            updateLikeButton();

            // Show post content
            document.getElementById('postContent').style.display = 'block';
        }

        // Load comments
        async function loadComments() {
            const postId = getPostId();
            const token = localStorage.getItem('access_token');
            
            if (!token) return;

            try {
                const response = await fetch(`/api/forum/posts/${postId}/comments`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const comments = await response.json();
                    displayComments(comments);
                } else {
                    console.error('Error loading comments:', response.status);
                }
            } catch (error) {
                console.error('Error loading comments:', error);
            }
        }

        // Display comments
        function displayComments(comments) {
            const container = document.getElementById('commentsContainer');
            const emptyState = document.getElementById('emptyComments');
            
            if (comments.length === 0) {
                container.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }
            
            container.style.display = 'block';
            emptyState.style.display = 'none';
            container.innerHTML = '';
            
            comments.forEach(comment => {
                const commentElement = createCommentElement(comment);
                container.appendChild(commentElement);
            });
        }

        // Create comment element
        function createCommentElement(comment) {
            const commentDiv = document.createElement('div');
            commentDiv.className = 'comment-item';
            commentDiv.id = `comment-${comment.id}`;
            
            const canEdit = currentUserId && currentUserId === comment.user_id;
            
            commentDiv.innerHTML = `
                <div class="comment-header">
                    <div>
                        <span class="comment-author">User #${comment.user_id}</span>
                        <span class="comment-date ms-2">${formatDate(comment.created_at)}</span>
                        ${comment.updated_at !== comment.created_at ? '<small class="text-muted ms-2">(edited)</small>' : ''}
                    </div>
                    ${canEdit ? `
                        <div class="comment-actions">
                            <button class="btn btn-sm btn-outline-secondary" onclick="toggleEditComment(${comment.id})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteComment(${comment.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    ` : ''}
                </div>
                <div class="comment-content" id="comment-content-${comment.id}">
                    ${escapeHtml(comment.content)}
                </div>
                <div class="edit-form" id="comment-edit-${comment.id}">
                    <textarea class="form-control" id="comment-edit-text-${comment.id}" rows="3">${escapeHtml(comment.content)}</textarea>
                    <div class="edit-actions">
                        <button class="btn btn-sm btn-primary" onclick="saveCommentEdit(${comment.id})">Save</button>
                        <button class="btn btn-sm btn-secondary" onclick="cancelCommentEdit(${comment.id})">Cancel</button>
                    </div>
                </div>
            `;
            
            return commentDiv;
        }

        // Create comment
        async function createComment() {
            const postId = getPostId();
            const token = localStorage.getItem('access_token');
            const content = document.getElementById('commentContent').value.trim();
            
            if (!content) {
                alert('Please enter a comment');
                return;
            }
            
            try {
                const response = await fetch(`/api/forum/posts/${postId}/comments`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ content: content })
                });
                
                if (response.ok) {
                    const newComment = await response.json();
                    
                    // Clear form
                    document.getElementById('commentContent').value = '';
                    
                    // Reload comments
                    loadComments();
                    
                    // Update comment count
                    currentPost.comment_count++;
                    document.getElementById('commentCount').textContent = currentPost.comment_count;
                    document.getElementById('commentsCount').textContent = currentPost.comment_count;
                    
                    alert('Comment posted successfully!');
                } else {
                    const error = await response.json();
                    alert('Error posting comment: ' + (error.detail || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error creating comment:', error);
                alert('Failed to post comment');
            }
        }

        // Toggle like
        async function toggleLike() {
            const postId = getPostId();
            const token = localStorage.getItem('access_token');
            
            if (!token) {
                alert('Please login to like posts');
                window.location.href = 'login.html';
                return;
            }
            
            try {
                const method = isLiked ? 'DELETE' : 'POST';
                const response = await fetch(`/api/forum/posts/${postId}/like`, {
                    method: method,
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    isLiked = !isLiked;
                    currentPost.like_count += isLiked ? 1 : -1;
                    document.getElementById('likeCount').textContent = currentPost.like_count;
                    updateLikeButton();
                } else {
                    alert('Error updating like status');
                }
            } catch (error) {
                console.error('Error toggling like:', error);
                alert('Failed to update like status');
            }
        }

        // Update like button
        function updateLikeButton() {
            const likeBtn = document.getElementById('likeBtn');
            if (isLiked) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '<i class="fas fa-heart"></i> <span id="likeCount">' + currentPost.like_count + '</span> liked';
            } else {
                likeBtn.classList.remove('liked');
                likeBtn.innerHTML = '<i class="fas fa-heart"></i> <span id="likeCount">' + currentPost.like_count + '</span> likes';
            }
        }

        // Toggle edit mode for post
        function toggleEditMode() {
            const contentDiv = document.getElementById('postContentText');
            const editForm = document.createElement('div');
            editForm.className = 'edit-form';
            editForm.innerHTML = `
                <textarea class="form-control" id="editPostContent" rows="6">${currentPost.content}</textarea>
                <div class="edit-actions mt-3">
                    <button class="btn btn-primary" onclick="savePostEdit()">Save Changes</button>
                    <button class="btn btn-secondary" onclick="cancelPostEdit()">Cancel</button>
                </div>
            `;
            
            contentDiv.style.display = 'none';
            contentDiv.parentNode.insertBefore(editForm, contentDiv.nextSibling);
            
            document.getElementById('editBtn').style.display = 'none';
            document.getElementById('deleteBtn').style.display = 'none';
        }

        // Save post edit
        async function savePostEdit() {
            const postId = getPostId();
            const token = localStorage.getItem('access_token');
            const newContent = document.getElementById('editPostContent').value.trim();
            
            if (!newContent) {
                alert('Content cannot be empty');
                return;
            }
            
            try {
                const response = await fetch(`/api/forum/posts/${postId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ content: newContent })
                });
                
                if (response.ok) {
                    currentPost.content = newContent;
                    document.getElementById('postContentText').textContent = newContent;
                    cancelPostEdit();
                    alert('Post updated successfully!');
                } else {
                    alert('Error updating post');
                }
            } catch (error) {
                console.error('Error updating post:', error);
                alert('Failed to update post');
            }
        }

        // Cancel post edit
        function cancelPostEdit() {
            const editForm = document.querySelector('.edit-form');
            if (editForm) {
                editForm.remove();
            }
            document.getElementById('postContentText').style.display = 'block';
            document.getElementById('editBtn').style.display = 'inline-flex';
            document.getElementById('deleteBtn').style.display = 'inline-flex';
        }

        // Delete post
        async function deletePost() {
            if (!confirm('Are you sure you want to delete this post? This action cannot be undone.')) {
                return;
            }
            
            const postId = getPostId();
            const token = localStorage.getItem('access_token');
            
            try {
                const response = await fetch(`/api/forum/posts/${postId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    alert('Post deleted successfully!');
                    window.location.href = 'forum.html';
                } else {
                    alert('Error deleting post');
                }
            } catch (error) {
                console.error('Error deleting post:', error);
                alert('Failed to delete post');
            }
        }

        // Toggle edit comment
        function toggleEditComment(commentId) {
            const contentDiv = document.getElementById(`comment-content-${commentId}`);
            const editForm = document.getElementById(`comment-edit-${commentId}`);
            
            contentDiv.style.display = 'none';
            editForm.style.display = 'block';
        }

        // Save comment edit
        async function saveCommentEdit(commentId) {
            const token = localStorage.getItem('access_token');
            const newContent = document.getElementById(`comment-edit-text-${commentId}`).value.trim();
            
            if (!newContent) {
                alert('Comment cannot be empty');
                return;
            }
            
            try {
                const response = await fetch(`/api/forum/comments/${commentId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ content: newContent })
                });
                
                if (response.ok) {
                    const updatedComment = await response.json();
                    document.getElementById(`comment-content-${commentId}`).textContent = updatedComment.content;
                    cancelCommentEdit(commentId);
                    alert('Comment updated successfully!');
                } else {
                    alert('Error updating comment');
                }
            } catch (error) {
                console.error('Error updating comment:', error);
                alert('Failed to update comment');
            }
        }

        // Cancel comment edit
        function cancelCommentEdit(commentId) {
            const contentDiv = document.getElementById(`comment-content-${commentId}`);
            const editForm = document.getElementById(`comment-edit-${commentId}`);
            
            contentDiv.style.display = 'block';
            editForm.style.display = 'none';
        }

        // Delete comment
        async function deleteComment(commentId) {
            if (!confirm('Are you sure you want to delete this comment?')) {
                return;
            }
            
            const token = localStorage.getItem('access_token');
            
            try {
                const response = await fetch(`/api/forum/comments/${commentId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    // Remove comment from DOM
                    const commentElement = document.getElementById(`comment-${commentId}`);
                    if (commentElement) {
                        commentElement.remove();
                    }
                    
                    // Update comment count
                    currentPost.comment_count--;
                    document.getElementById('commentCount').textContent = currentPost.comment_count;
                    document.getElementById('commentsCount').textContent = currentPost.comment_count;
                    
                    // Show empty state if no comments left
                    const remainingComments = document.querySelectorAll('.comment-item').length;
                    if (remainingComments === 0) {
                        document.getElementById('commentsContainer').style.display = 'none';
                        document.getElementById('emptyComments').style.display = 'block';
                    }
                    
                    alert('Comment deleted successfully!');
                } else {
                    alert('Error deleting comment');
                }
            } catch (error) {
                console.error('Error deleting comment:', error);
                alert('Failed to delete comment');
            }
        }

        // Share post
        function sharePost() {
            const postUrl = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: currentPost.title,
                    url: postUrl
                }).catch(err => console.log('Error sharing:', err));
            } else {
                // Fallback: copy to clipboard
                navigator.clipboard.writeText(postUrl).then(() => {
                    alert('Post link copied to clipboard!');
                }).catch(err => {
                    console.error('Error copying to clipboard:', err);
                    alert('Failed to copy link');
                });
            }
        }

        // Scroll to comments
        function scrollToComments() {
            document.querySelector('.comment-section').scrollIntoView({ 
                behavior: 'smooth' 
            });
        }

        // Utility functions
        function showLoading(show) {
            document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
            document.getElementById('postContent').style.display = show ? 'none' : 'block';
        }

        function showError(message) {
            const container = document.getElementById('postContent');
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle text-danger"></i>
                    <h4>Error</h4>
                    <p>${message}</p>
                    <button class="btn btn-primary" onclick="loadPost()">
                        <i class="fas fa-redo me-2"></i>Retry
                    </button>
                </div>
            `;
            container.style.display = 'block';
        }

        function showLoginPrompt() {
            const container = document.getElementById('postContent');
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-sign-in-alt"></i>
                    <h4>Login Required</h4>
                    <p>Please login to view this post and participate in the discussion.</p>
                    <a class="btn btn-primary" href="login.html">
                        <i class="fas fa-sign-in-alt me-2"></i>Login
                    </a>
                </div>
            `;
            container.style.display = 'block';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 1) return 'just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            if (diffDays < 7) return `${diffDays}d ago`;
            
            return date.toLocaleDateString();
        }
    </script>
</body>
</html>
